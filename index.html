:root{--paper:#f3e8d3;--ink:#392e29;--accent:#7b4b49}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 15%,#58453b,#211918 75%);color:#e9d9c3;font-family:Georgia,serif;min-height:100vh}.top{max-width:1080px;margin:auto;padding:20px;display:flex;align-items:center;justify-content:space-between;gap:12px}.top small{font:11px Arial,sans-serif;letter-spacing:2px}.top button,.nav button,.inside button{cursor:pointer}.top button{border:1px solid #a48d78;color:#eee0ce;background:transparent;padding:10px 15px}.book{max-width:960px;min-height:620px;margin:12px auto 0;display:flex;justify-content:center;perspective:1400px;padding:0 16px}.cover{background:linear-gradient(105deg,#291b1d,#513337 14%,#362226 30%,#442a2e);box-shadow:inset 13px 0 15px #0d090a99,8px 8px 0 #bda383,16px 22px 45px #0905059c;border-radius:4px 10px 10px 4px;width:min(470px,100%);min-height:610px;padding:24px;animation:flip .45s ease}.frame{border:1px solid #b69a70;outline:1px solid #b69a7066;outline-offset:-8px;min-height:560px;padding:55px 28px;display:flex;flex-direction:column;align-items:center;text-align:center;justify-content:center}.cover .star{font-size:30px;color:#d0b287;margin-bottom:40px}.kicker{font:10px Arial,sans-serif;letter-spacing:3px}.cover h1{font-size:clamp(50px,7vw,78px);font-weight:normal;line-height:.95;letter-spacing:-2px;margin:25px 0}.line{width:65px;height:1px;background:#c3a27a;margin:15px auto}.subtitle{font-style:italic;font-size:19px;line-height:1.5;max-width:300px}.author{font:12px Arial,sans-serif;letter-spacing:5px;margin-top:auto;padding-top:50px}.spread{width:100%;display:grid;grid-template-columns:1fr 1fr;box-shadow:0 15px 55px #080505a8;animation:flip .4s ease;min-height:610px}.leaf{background:linear-gradient(90deg,#e0d2bc,#f7ecda 8%,#f4e8d5 90%,#e1d2bb);color:var(--ink);padding:56px 55px 55px;position:relative;border-radius:4px 0 0 4px}.leaf.second{background:linear-gradient(90deg,#d1bfa6,#f4e8d4 9%,#f7ebd8 96%,#e7d7c0);border-radius:0 4px 4px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.label{font:10px Arial,sans-serif;letter-spacing:2px;color:#9b806c;text-transform:uppercase;margin-bottom:36px}.number{font:11px Arial,sans-serif;letter-spacing:2px;color:#956d60}.leaf h2{font-size:clamp(29px,3.5vw,45px);font-weight:normal;line-height:1.08;margin:16px 0 26px}.leaf p{font-size:18px;line-height:1.52;margin:0 0 16px}.folio{position:absolute;bottom:24px;left:50%;color:#9c836e;font-size:13px}.quote{font-size:88px;color:#ac8d75;line-height:1}.second p{font-style:italic;color:#907966;font-size:23px}.note{font-size:14px!important;color:#9a806b;margin-top:40px!important}.nav{max-width:960px;margin:24px auto 0;display:flex;align-items:center;justify-content:space-between;padding:0 18px;gap:10px}.nav button{padding:12px 18px;background:transparent;border:1px solid #8f7764;color:#eee0ce}.nav button:disabled{opacity:.3;cursor:default}.progress{text-align:center;font:12px Arial,sans-serif;color:#d6c2a8}.bar{height:2px;width:160px;background:#796251;margin:12px auto 0}.bar div{height:100%;background:#e4c49d;transition:width .3s}.hint{text-align:center;font:11px Arial,sans-serif;color:#a28d7b;margin:20px auto 28px}.toc{position:fixed;right:18px;top:70px;bottom:18px;z-index:10;width:min(440px,calc(100vw - 36px));overflow:auto;background:#f4e9d5;color:#372e28;box-shadow:0 20px 70px #000a;padding:22px 30px}.toc h2{font-size:36px;font-weight:normal}.toc h3{font-size:18px;color:#805752;font-weight:normal;margin-top:25px}.toc button{display:block;text-align:left;width:100%;padding:9px 0;border:0;border-bottom:1px solid #dbcab3;background:transparent;color:#443630;cursor:pointer}.toc button:hover{color:#a15d57}.toc .close{float:right;width:auto;border:0}.hidden{display:none!important}.inside{display:flex;gap:8px;align-items:center;margin-top:22px}.inside button{background:none;color:#7d4948;border:1px solid #b89d86;padding:9px}.inside button:hover{background:#e9d9c3}@ke /* Giro tridimensional de hojas: anverso, reverso, canto y sombra dinámica. */
.book{position:relative;isolation:isolate;overflow:visible}
.spread{animation:none}
.page-turn{position:absolute;inset:0 16px;z-index:8;pointer-events:none;perspective:2200px;--turn-time:980ms}
.page-turn .turn-static{position:absolute;top:0;bottom:0;width:50%;overflow:hidden;box-shadow:inset -18px 0 25px -22px #24150e6b}
.page-turn.forward .turn-static{left:0}
.page-turn.backward .turn-static{right:0}
.page-turn .turn-static .leaf{height:100%;min-height:100%;border-radius:0}
.page-turn .turn-sheet{position:absolute;top:0;bottom:0;width:50%;transform-style:preserve-3d;transition:transform var(--turn-time) cubic-bezier(.28,.05,.28,1);will-change:transform}
.page-turn.forward .turn-sheet{right:0;transform-origin:left center;transform:rotateY(0deg)}
.page-turn.backward .turn-sheet{left:0;transform-origin:right center;transform:rotateY(0deg)}
.page-turn.forward.active .turn-sheet{transform:rotateY(-180deg)}
.page-turn.backward.active .turn-sheet{transform:rotateY(180deg)}
.page-turn .turn-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;background:linear-gradient(90deg,#e4d4ba,#f9eedc 12%,#f3e5ce 96%);color:var(--ink);box-shadow:inset -1px 0 0 #d2bea2}
.page-turn .turn-face.back{transform:rotateY(180deg);background:linear-gradient(90deg,#e0cfb5,#f8edda 12%,#e7d6bd);box-shadow:inset 12px 0 25px -20px #301e1455}
.page-turn .turn-face .leaf{height:100%;min-height:100%;border-radius:0}
.page-turn .turn-face .leaf.second{display:flex}
.page-turn .turn-face::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 20%,#24160f29 100%);opacity:0;transition:opacity var(--turn-time);pointer-events:none}
.page-turn.active .turn-face::after{opacity:.7}
.page-turn .turn-face.back::after{background:linear-gradient(90deg,#24160f29,transparent 70%)}
.page-turn .turn-sheet::before{content:"";position:absolute;top:1%;bottom:1%;left:-4px;width:5px;background:#e1ceb0;transform:translateZ(-1px);box-shadow:0 0 15px #2b1c1360}
.book.turning{pointer-events:none}
@media(max-width:700px){.page-turn{inset:0 16px}.page-turn .turn-static{display:none}.page-turn .turn-sheet{width:100%;left:0!important;right:0!important;transform-origin:left center!important}.page-turn.backward .turn-sheet{transform-origin:right center!important}.page-turn .turn-face .leaf.second{display:none}.page-turn .turn-face{background:#f4e8d5}}

 .spread .leaf.index-page p{font-size:13.2px;line-height:1.31;margin:0 0 10px;text-align:left;hyphens:none}.spread .leaf.index-page h2{font-size:30px;margin-bottom:12px}.spread .leaf.index-page .label{margin-bottom:12px}@media(max-width:700px){.spread .leaf.index-page p{font-size:13.5px;line-height:1.45;margin-bottom:11px}} </style></head><body><header class="top"><small>UNA HISTORIA PARA SOFI</small><button id="indexBtn">ÍNDICE DE CAPÍTULOS ☰</button></header><aside id="toc" class="toc hidden"><button class="close" id="close">Cerrar ×</button><h2>Índice</h2><div id="tocItems"></div></aside><main class="book" id="book"></main><nav class="nav"><button id="prev">← Anterior</button><div class="progress"><span id="location">Portada</span><div class="bar"><div id="bar"></div></div></div><button id="next">Siguiente →</button></nav><p class="hint">Usa las flechas del teclado para pasar las páginas. Funciona sin internet.</p><script>
const groups=[['I · El desorden aparente',['El problema de tener demasiadas cosas','Organizar: verbo universal','El tercer integrante de nuestras llamadas','La arrogancia de creer que puedo hacerlo todo','Excel: una historia de amor y odio','No puedo dormir, tengo un rey que mejorar']],['II · Las cosas que encuentro',['El vendedor que quería construir una empresa','El día que resucité una motocicleta','Canciones que saben demasiado de mí','Un artista que todavía no se presenta como artista','Preguntas que nadie me hizo','El peligro de decir «se me ocurrió una idea»']],['III · Los kilómetros también guardan recuerdos',['Manual para no perderse en un aeropuerto','Montería y el arte de encontrarte','La fotografía que nunca habría planeado','El lugar al que siempre quiero regresar','Lo que sucede en videollamada queda en videollamada','Las conversaciones que no necesitan un tema']],['IV · Lo que no cabe en los cajones',['El hombre que me enseñó a hablar con Dios','Las conversaciones que todavía quisiera tener','El precio de querer resolverlo todo','No todas las personas que atiendo saben quién soy','Las cosas que nunca aprendí a decir','El extraño arte de crecer']],['V · Hacer espacio',['Lo que quiero ser cuando sea grande','Aprender a descansar sin sentir culpa','Una casa con demasiadas reglas','Las cosas que todavía no he hecho','Lo que aprendí sin darme cuenta','Un lugar para cada cosa']]];
const chapters=groups.flatMap(([part,titles])=>titles.map(title=>({part,title})));
// Extractos de demostración. Sustituir por los capítulos completos aprobados cuando se incorporen al archivo.
const excerpts={4:['Siempre he tenido una teoría sobre mí mismo: si alguien más puede aprender a hacer algo, probablemente yo también.','El problema es que a veces confundo «puedo aprenderlo» con «seguramente puedo hacerlo esta misma tarde».','Y así es como empiezan aproximadamente el ochenta por ciento de mis problemas.','El otro veinte por ciento comienza cuando digo: «Tengo una idea».'],6:['Hay una pregunta que probablemente muchas personas se hacen cuando llegan a cierta edad: «¿Qué estoy haciendo con mi vida?».','Yo también me la he hecho.','Solo que, en algunas ocasiones, la respuesta ha sido: «Esperando a que termine de mejorarse el Rey Bárbaro».'],7:['Hay algo curioso en trabajar vendiendo perfumes.','Uno pasa buena parte del día ayudando a otras personas a encontrar algo que les guste.','Y mientras uno escucha lo que buscan los demás, a veces se olvida de preguntarse qué está buscando uno mismo.','Yo, por ejemplo, estaba buscando una empresa.'],8:['Hay pocas cosas tan bonitas como escuchar el motor de una motocicleta que te gusta.','Y hay pocas cosas tan desesperantes como intentar encenderla y descubrir que ha decidido no colaborar.','Mi CFMOTO y yo tenemos una relación bastante particular.','Yo la quiero. Ella, aparentemente, considera que el cariño debe demostrarse mediante pruebas constantes de paciencia.'],9:['Tengo una teoría: hay canciones que deberían pedir permiso antes de describir la vida de uno con tanta precisión.','Porque no es normal estar tranquilamente escuchando música y que, de pronto, alguien que jamás te ha conocido consiga explicar algo que llevabas semanas intentando entender.'],10:['Hay una pregunta que siempre me ha parecido un poco complicada: «¿Tú eres artista?».','Porque depende.','Si me preguntan si me gusta dibujar, la respuesta es sí.'],11:['Tengo un problema con las preguntas.','No con responderlas.','Con hacerlas.','Porque mi cerebro tiene la costumbre de interesarse por asuntos que, hasta cinco segundos antes, no tenían ninguna relación con mi vida.']};
const newContent={"12": {"title": "El peligro de decir «se me ocurrió una idea»", "paras": ["Hay una frase que debería venir acompañada de una alarma. No una alarma discreta, de esas que uno apaga y continúa durmiendo. Hablo de una sirena industrial, una luz roja y un aviso que diga: «Allan está a punto de comenzar otro proyecto».", "La frase es sencilla: «Se me ocurrió una idea».", "Generalmente la digo con entusiasmo. Eso es lo peligroso. Si la dijera con cara de preocupación, alguien podría detenerme a tiempo. Pero aparezco sonriente, convencido de que he descubierto una solución magnífica para algo que, hasta ese momento, quizá ni siquiera era un problema.", "Una página web. Un sistema de inventarios. Una forma de organizar comisiones. Una publicación. Una nueva manera de presentar perfumes. A veces la idea es pequeña y cabe en una tarde. Otras veces se convierte en un proyecto que necesita horarios, presupuestos, pruebas y una paciencia que no venía incluida en el entusiasmo original.", "Me gusta construir cosas. Eso ya debe haber quedado claro. Me entusiasma ver cómo algo pasa de ser una conversación a convertirse en un objeto, un diseño o una decisión real. Lo que todavía estoy aprendiendo es que una buena idea no siempre tiene que ejecutarse inmediatamente.", "Con EssGlow me ocurrió muchas veces. Quería que todo funcionara, que la página fuera bonita, que las ventas estuvieran registradas y que las personas tuvieran respuestas. Cuando algo no salía, lo sentía como si me estuviera fallando a mí mismo. Entonces intentaba resolverlo haciendo todavía más cosas. Es una estrategia curiosa: combatir el cansancio agregando trabajo.", "Sofi ha visto esa versión de mí. La que empieza explicando una propuesta y termina hablando de cinco posibilidades distintas, todas urgentes, todas brillantes y todas necesitadas de una hoja de cálculo. A veces imagino su expresión al otro lado de la llamada. Probablemente está calculando cuánto tiempo falta para que yo recuerde que también debo comer.", "Pero no quiero renunciar a esa parte mía. La curiosidad, la iniciativa y las ganas de intentar cosas nuevas me han regalado experiencias que no habría vivido si siempre hubiera esperado a sentirme preparado. Me llevaron a aprender, a equivocarme, a viajar y a conocer capacidades que desconocía.", "Solo quiero aprender a ponerle una silla a cada idea y decirle: «Espérame aquí un momento». No todas necesitan convertirse en tareas. Algunas pueden quedarse en una libreta hasta que llegue su turno.", "Quizá la próxima vez que diga «se me ocurrió una idea», antes de abrir la computadora, me haga tres preguntas: ¿de verdad quiero hacer esto?, ¿tengo tiempo? y ¿he dormido lo suficiente?", "La tercera podría salvarme la vida social.", "Por ahora he decidido continuar con una idea que ya comenzó: este libro. Me parece justo terminar algo antes de iniciar otras diecisiete cosas.", "Aunque, ahora que lo pienso, podría diseñarle una página web.", "No. Mejor no hablemos de eso todavía."]}, "13": {"title": "Manual para no perderse en un aeropuerto", "paras": ["Hay personas que suben a un avión con la tranquilidad de quien toma un autobús. Llegan, muestran un documento, encuentran su puerta y se sientan a esperar. Parecen conocer secretos que los demás no recibimos al nacer.", "Yo iba a viajar solo por primera vez para conocer a Sofi. Mi experiencia en aeropuertos no era precisamente amplia, pero mis ganas de verla compensaban bastante bien mi falta de conocimiento. Eso creía yo.", "Un aeropuerto es un lugar diseñado para que miles de personas se muevan siguiendo señales. En teoría, basta con leerlas. En la práctica, uno puede leer una señal y seguir sin tener la menor idea de si va hacia el lugar correcto.", "Me descubrí revisando documentos más veces de las necesarias. También hice preguntas. Muchas. No por falta de confianza en las personas que trabajaban allí, sino porque necesitaba confirmar que no terminaría en un avión hacia un país completamente diferente. Sería una manera bastante elaborada de llegar tarde a una cita.", "El trayecto tuvo sus complicaciones y cambios. Hubo momentos en que pensé más en conexiones, tiempos y aeropuertos de lo que cualquier persona enamorada debería pensar. Sin embargo, detrás de cada preocupación había una imagen muy sencilla: Sofi esperándome.", "Eso hizo que todo pareciera importante. La maleta, el pasaporte, la puerta de embarque, el asiento, la hora. Cada detalle formaba parte de la distancia que estaba dejando atrás.", "Habíamos pasado tanto tiempo viéndonos a través de una pantalla que el viaje parecía casi irreal. Yo sabía cómo sonaba su voz. Conocía sus expresiones, su manera de reír y esas pequeñas pausas que aparecen cuando uno está pensando qué responder. Pero no sabía cómo sería tenerla frente a mí sin que hubiera un teléfono entre nosotros.", "Mientras el avión avanzaba, comprendí que la valentía no siempre se siente como seguridad. A veces se siente como miedo acompañado de una decisión firme. Yo estaba nervioso y seguí adelante de todos modos.", "Si algún día alguien me pide un manual para viajar solo, le daré recomendaciones prácticas: revisar documentos, llegar con tiempo, escuchar los anuncios y preguntar sin vergüenza.", "Pero también añadiré una recomendación menos técnica: tener una razón bonita para llegar.", "La mía tenía nombre, estudiaba Derecho y vivía en Montería.", "Y, por primera vez, los kilómetros estaban empezando a disminuir de verdad."]}, "14": {"title": "Montería y el arte de encontrarte", "paras": ["Uno puede imaginar un encuentro durante meses y, aun así, descubrir que la realidad no se parece exactamente a lo que había ensayado en la cabeza.", "Yo había imaginado muchas veces cómo sería ver a Sofi. Tal vez la saludaría con una frase ingeniosa. Tal vez conseguiría parecer tranquilo. Tal vez diría algo memorable, digno de aparecer en una película romántica.", "Por supuesto, cuando llegó el momento, mi cerebro decidió que ninguna de esas opciones era necesaria.", "Lo importante fue verla.", "De pronto, la persona que conocía a través de llamadas estaba allí, ocupando un lugar real en el mundo. Podía acercarme sin esperar a que cargara la conexión. Podía escucharla sin audífonos. Podía abrazarla.", "Recuerdo su emoción. Recuerdo las lágrimas de alegría. Y recuerdo que, por un instante, todo lo que había ocurrido antes del viaje dejó de importar. Los trámites, las dudas, las horas de espera: todo había servido para llegar a ese momento.", "Montería se convirtió en algo más que una ciudad de Colombia. Sus calles, el calor y los lugares que recorrimos quedaron unidos a una sensación que todavía me cuesta explicar. Era una ciudad nueva y, al mismo tiempo, tenía algo familiar. Tal vez porque allí estaba ella.", "No hicimos falta una celebración extraordinaria para que el día fuera especial. Hubo un centro comercial, comida, conversaciones y esa extraña felicidad de comprobar que podíamos compartir cosas normales. Después de tanto tiempo hablando de lo que haríamos cuando nos viéramos, finalmente estábamos haciéndolo.", "Incluso comer en KFC adquirió una importancia histórica que la empresa probablemente desconoce. Hay personas que recuerdan cenas elegantes. Yo recuerdo la alegría de sentarme cerca de ella y saber que, por unas horas, no tendríamos que despedirnos al terminar una videollamada.", "Lo más hermoso no fue que todo saliera perfecto. Fue descubrir que no necesitaba salir perfecto. Podíamos reírnos, caminar, hablar y guardar silencios sin tener que convertir cada minuto en una escena memorable.", "Yo había viajado para encontrar a una persona que ya conocía. Y terminé descubriendo una forma nueva de conocerla: en los gestos cotidianos, en la manera de mirar las cosas, en la distancia corta que existe entre dos personas que pueden tomarse de la mano.", "No sé si alguna vez podré explicar exactamente lo que sentí durante aquel primer abrazo.", "Pero sí sé que, desde entonces, la palabra «lejos» comenzó a significar algo distinto.", "Porque ahora sabía con precisión a quién quería volver."]}, "15": {"title": "La fotografía que nunca habría planeado", "paras": ["Hay fotografías que uno prepara. Se elige el lugar, se acomoda la ropa, se revisa la luz y se intenta parecer una persona naturalmente fotogénica. El resultado suele incluir varias tomas y al menos una discusión sobre quién cerró los ojos.", "Y luego están las fotografías que aparecen mientras uno está ocupado viviendo.", "Una de mis favoritas pertenece a la segunda categoría.", "En ella estoy amarrándole los zapatos a Sofi.", "No es una escena espectacular. No hay fuegos artificiales, un atardecer perfectamente calculado ni un fotógrafo dando instrucciones. Es simplemente un momento pequeño. Una acción que probablemente habría olvidado si nadie la hubiera guardado.", "Pero ahí está.", "Y me gusta por lo que dice sin necesidad de explicarlo.", "Cuando uno piensa en el amor, suele imaginar promesas enormes. Viajes, proyectos, aniversarios y palabras que se dicen con el corazón acelerado. Todo eso puede ser precioso. Sin embargo, hay otra forma de cariño que aparece en cosas muy sencillas: detenerse, prestar atención y ayudar sin convertirlo en un acontecimiento.", "No creo que amarrar unos zapatos me convierta en el protagonista de una gran historia romántica. Sería una conclusión exagerada y, además, establecería un precedente peligroso para cualquier persona que haya aprendido a hacer un nudo.", "Lo que me conmueve es que la fotografía guarda una versión nuestra que no estaba intentando demostrar nada.", "Éramos nosotros, sin más.", "A veces miro los recuerdos del viaje y pienso en todo lo que no quedó registrado. Las frases que dijimos mientras caminábamos. Los momentos en que nos reímos por algo que hoy sería imposible explicar. Las miradas que nadie fotografió. Los segundos que parecían tan normales que no pensamos en conservarlos.", "Supongo que por eso me gustan las fotografías espontáneas. No pretenden contarlo todo. Solo dejan una pequeña puerta abierta para que la memoria haga el resto.", "Si algún día tenemos una casa, me gustaría que esa imagen estuviera en algún lugar. No necesariamente en un marco enorme. Podría estar entre otras fotos, junto a recuerdos que todavía no existen.", "Y cuando alguien pregunte qué está pasando, podré responder con toda la solemnidad posible:", "«Un acto de servicio de alta complejidad técnica».", "Sofi seguramente dirá que solamente le estaba amarrando los zapatos.", "Y tendrá razón.", "Eso es precisamente lo bonito."]}, "16": {"title": "El lugar al que siempre quiero regresar", "paras": ["Durante mucho tiempo pensé que regresar significaba volver a un lugar. A una casa, una calle, una habitación o una ciudad conocida.", "Después de viajar a Colombia descubrí que a veces uno quiere regresar a una persona.", "Montería tiene lugares que recuerdo con cariño, pero si intento identificar cuál fue mi favorito, siempre termino pensando en lo mismo: cualquiera en el que estuviera Sofi.", "Eso suena peligrosamente romántico. Soy consciente. Incluso podría considerarse una frase diseñada para ganar puntos en una relación. Pero me temo que es verdad.", "Lo que más extraño del viaje no son únicamente los sitios que conocimos. Extraño poder hacer cosas sin calcular la distancia. Caminar a su lado. Escuchar una ocurrencia y responder en el mismo instante. Mirarla cuando se ríe. Descubrir que el tiempo puede pasar demasiado rápido incluso cuando uno no está haciendo nada extraordinario.", "Antes de verla, nuestros planes estaban escritos en futuro. «Cuando estemos juntos». «Cuando vaya». «Cuando podamos». Durante aquellos días, por fin hubo un presente. Y me gustó tanto que ahora quiero construir otros.", "Claro que el regreso a Guatemala también tenía que llegar. Los viajes tienen esa costumbre desagradable de incluir una fecha de vuelta. Uno compra un boleto con mucha ilusión y después descubre que el mismo documento contiene una pequeña traición.", "Volver no significó que el viaje hubiera sido menos feliz. Significó que había sido suficientemente importante como para extrañarlo.", "Y con el tiempo he comprendido que no quiero vivir solamente esperando el siguiente avión. Quiero que nuestros días a distancia también tengan sentido. Que podamos conversar de cosas que no sean planes, fechas o dinero. Que nos acompañemos sin convertir cada llamada en una reunión de asuntos pendientes.", "Porque el amor también tiene que caber en un martes común.", "Me gustaría volver a Montería. Me gustaría conocer más lugares contigo. Y, sobre todo, me gustaría que algún día la distancia dejara de ser una condición permanente de nuestra historia.", "No sé exactamente cómo ocurrirá. Tenemos estudios, trabajo, proyectos y responsabilidades. Hay decisiones que todavía necesitan tiempo.", "Pero ya sé algo que antes solo podía imaginar: estar contigo se siente bien en la vida real.", "No solamente en una pantalla.", "Y eso convierte el futuro en una posibilidad muy bonita."]}, "17": {"title": "Lo que sucede en videollamada queda en videollamada", "paras": ["Nuestra relación tiene una testigo bastante indiscreta: la cámara del teléfono.", "Ha visto nuestras caras de sueño, nuestras risas, las conversaciones serias y una cantidad considerable de momentos en los que ninguno de los dos sabía qué decir. También ha presenciado situaciones que, por respeto a la privacidad de los involucrados, no serán reproducidas con detalle.", "Quiero dejar constancia de que esta decisión es estrictamente editorial.", "Y quizá un poco jurídica.", "Al principio, una videollamada puede parecer un sustituto de la presencia. Algo que hacemos porque no podemos estar físicamente juntos. Pero con el tiempo se convierte en un lugar propio, con costumbres y pequeñas tradiciones.", "Nos hemos acompañado mientras hacemos otras cosas. Hemos jugado, conversado, reído y, en ocasiones, simplemente permanecido allí, cada uno en su espacio. Me gusta esa clase de compañía. No exige que el otro esté ofreciendo entretenimiento constante.", "También hemos descubierto que la tecnología tiene una capacidad extraordinaria para arruinar momentos cuidadosamente construidos. Una conexión que falla, un audio que se corta, una cámara que se congela justo cuando alguien está poniendo una expresión ridícula.", "Y, sin embargo, muchas veces eso termina haciéndonos reír.", "Hay juegos que solo tienen sentido porque los compartimos. Preguntas que empiezan inocentemente y después requieren una revisión del reglamento. Bromas que probablemente serían imposibles de explicar fuera de la llamada.", "Si alguna vez este libro fuera examinado por un tribunal, solicito que ciertas conversaciones sean declaradas confidenciales. No porque haya ocurrido nada terrible, sino porque el amor también necesita lugares donde poder ser absurdo sin testigos.", "Lo que más agradezco de esas llamadas es que nos han permitido conocernos sin tener que presentarnos siempre en nuestra mejor versión. Hay días en los que uno está cansado. Otros en los que no tiene ganas de hablar demasiado. Y otros en los que basta una tontería para recuperar la sonrisa.", "No todas las llamadas han sido perfectas. Algunas terminaron con sueño, otras con malentendidos y otras con la sensación de que todavía quedaban cosas por decir. Aprender a querernos también ha significado aprender a escuchar, respetar límites y reconocer cuando algo necesita hablarse con calma.", "Pero cuando pienso en nuestras videollamadas, no me quedo con los problemas técnicos ni con los silencios incómodos.", "Pienso en la tranquilidad de escuchar su voz al otro lado.", "Y en lo extraordinario que resulta que dos personas, separadas por tantos kilómetros, puedan inventarse una forma cotidiana de estar juntas."]}, "18": {"title": "Las conversaciones que no necesitan un tema", "paras": ["Hay conversaciones que empiezan con un propósito. Resolver una duda, organizar un viaje, preguntar por una tarea o decidir algo importante.", "Y hay otras que comienzan con un simple «¿qué haces?» y terminan mucho después, sin que nadie recuerde exactamente de qué estuvieron hablando.", "Estas últimas me gustan especialmente.", "Quizá porque nuestra relación ha tenido temporadas llenas de asuntos prácticos. Horarios, estudios, dinero, trabajo, la página web, pedidos y decisiones. Todas cosas reales, necesarias y a veces agotadoras.", "Pero Sofi no es una lista de pendientes.", "Y yo tampoco.", "Quiero que sigamos teniendo espacio para hablar de cosas pequeñas. De una canción que escuchamos. De una historia absurda del día. De lo que soñamos mientras dormíamos. De una película que queremos ver. O de absolutamente nada.", "Recuerdo que antes de convertirnos en pareja ya existía algo valioso entre nosotros: la curiosidad de seguir conversando. No necesitábamos que cada mensaje tuviera una finalidad. Bastaba con querer saber qué estaba pensando la otra persona.", "A veces me descubro hablando demasiado de proyectos. No porque quiera convertir cada llamada en una reunión, sino porque me emocionan las cosas que estamos intentando construir. Sin embargo, he aprendido que compartir una vida no significa hablar únicamente de cómo construirla.", "También significa disfrutarla mientras ocurre.", "Me gustaría que pudiéramos aburrirnos juntos sin sentir que estamos perdiendo el tiempo. Escuchar música. Hacer comentarios innecesarios sobre una película. Discutir amistosamente cuál comida es mejor. Permitirnos un silencio cómodo.", "Hay una intimidad especial en no tener que impresionar a alguien todo el tiempo.", "Sofi conoce algunas de mis preguntas más extrañas. Yo conozco ciertas maneras suyas de decir las cosas. A veces una palabra basta para provocar una risa porque detrás hay una historia que solo nosotros entendemos.", "Eso es construir un idioma compartido.", "No se aprende en ninguna academia. Aparece después de muchas conversaciones, de bromas repetidas y de momentos que parecen insignificantes mientras ocurren.", "Tal vez dentro de muchos años olvidemos el tema exacto de algunas llamadas. No recordaremos qué cenamos ni qué canción sonaba. Pero espero que permanezca la sensación de haber estado acompañados.", "Porque a veces el mejor tema de conversación es sencillamente este:", "«Estoy aquí. ¿Quieres quedarte un ratito?»."]}, "19": {"title": "El hombre que me enseñó a hablar con Dios", "paras": ["Mi papá fue pastor. Esa es una frase breve para hablar de alguien cuya presencia ocupaba tantos lugares en mi vida.", "Hay recuerdos que puedo contar con facilidad y otros que se quedan un momento detenidos antes de convertirse en palabras. Hablar de él pertenece a la segunda categoría. No porque quiera olvidarlo, sino porque hay personas a las que uno sigue queriendo de una forma que no cabe en una explicación ordenada.", "Cuando pienso en mi papá, no pienso únicamente en lo que hacía frente a otras personas. Pienso en la voz que conocía, en su manera de estar, en las cosas que me enseñó incluso sin proponérselo. Pienso en el hombre que me mostró una forma de acercarme a Dios.", "La fe, cuando se aprende cerca de alguien a quien amas, no es solamente un conjunto de ideas. También está hecha de gestos, de palabras escuchadas muchas veces y de preguntas que empiezan a aparecer conforme uno crece.", "Con el tiempo descubrí que creer no elimina las dudas. Tampoco convierte la vida en un camino sin pérdidas. Hay días en los que uno quisiera tener respuestas claras y recibe solamente silencio. Días en los que una oración sale con dificultad. Y días en los que recordar a alguien puede doler y consolar al mismo tiempo.", "Extraño a mi papá.", "Lo extraño en momentos importantes, cuando me gustaría contarle algo que logré. Lo extraño cuando necesito un consejo. Y también en momentos pequeños, esos en los que aparece una pregunta que él quizá habría sabido responder de una manera sencilla.", "A veces imagino qué pensaría de la persona que soy ahora. Del trabajo, de mis planes, de mis ideas imposibles y de mi costumbre de intentar resolverlo todo. Me gustaría mostrarle algunas cosas. Me gustaría escuchar su opinión sin tener que imaginarla.", "No puedo hacerlo de la manera que quisiera. Esa es una verdad con la que todavía aprendo a vivir.", "Pero puedo conservar algo de lo que me dejó. En la manera de tratar a otras personas. En la importancia de escuchar. En la posibilidad de hablar con Dios incluso cuando no encuentro palabras perfectas.", "No quiero convertir su recuerdo en una obligación de ser alguien impecable. Mi papá fue importante para mí, pero yo sigo siendo una persona que se equivoca, que aprende y que a veces no sabe qué hacer. Honrar lo que me enseñó también puede significar permitirme vivir mi propia vida.", "Me habría gustado que conociera a Sofi. Que escuchara cómo nos reímos. Que pudiera verla y entender por qué es tan importante para mí.", "Como no puedo presentarlos, hago algo distinto: le cuento a ella sobre él. Y cada vez que lo hago, una parte de su historia continúa viajando conmigo.", "Hay ausencias que nunca se vuelven pequeñas. Uno simplemente aprende a construir alrededor de ellas una vida donde también haya alegría.", "Y cuando me pregunto qué cosas de mi papá siguen presentes, encuentro una respuesta que me acompaña:", "Todavía sé que puedo hablar con Dios.", "Incluso cuando no sé exactamente qué decir."]}, "20": {"title": "Las conversaciones que todavía quisiera tener", "paras": ["Tengo una lista imaginaria de conversaciones pendientes.", "No está escrita en Excel. Por una vez, decidí que algo importante podía existir sin fórmulas.", "En esa lista hay preguntas que me gustaría hacerle a mi papá. Algunas son enormes: cómo enfrentaba sus preocupaciones, qué habría hecho ante ciertas decisiones, qué pensaba sobre crecer y equivocarse. Otras son mucho más sencillas. Me gustaría contarle una anécdota del trabajo, hablarle de una motocicleta o mostrarle un dibujo.", "Lo extraño de perder a alguien es descubrir que la ausencia también aparece en el futuro. No solamente extrañas lo que ya vivieron. Extrañas las conversaciones que habrían tenido, los cumpleaños que faltaron y las noticias que nunca pudiste darle.", "A veces pienso que, si pudiera sentarme una tarde con él, necesitaría preparar una lista para no olvidar nada. Y luego me doy cuenta de que probablemente olvidaría la lista en cuanto lo viera.", "Tal vez no haría ninguna de mis grandes preguntas.", "Tal vez solo querría escucharlo.", "Hay días en los que el recuerdo llega con tristeza. Otros en los que aparece acompañado de una sonrisa. No creo que una emoción invalide a la otra. Puedo estar agradecido por haberlo tenido y seguir sintiendo dolor por su ausencia.", "También puedo hablar de él sin convertir cada recuerdo en una ceremonia solemne. Seguro hubo momentos graciosos, días normales y pequeñas escenas familiares que merecen permanecer como eran: parte de una vida compartida.", "Me gustaría poder preguntarle si estaba orgulloso de mí. Pero, mientras esa respuesta no existe de la manera que quisiera, intento construir una vida de la que yo también pueda sentirme orgulloso.", "No siempre lo consigo.", "Hay decisiones que me cuestan, responsabilidades que me sobrepasan y momentos en los que me siento muy lejos de la persona que quiero llegar a ser. Aun así, sigo aquí, aprendiendo.", "Con el tiempo he comprendido que las conversaciones pendientes no deberían impedirme tener las que todavía son posibles. Puedo llamar a mi mamá. Puedo escuchar a las personas que quiero. Puedo decir algo bonito antes de que se convierta en una frase que desearía haber pronunciado.", "No quiero vivir guardando todas las palabras importantes para una ocasión perfecta.", "Quizá por eso escribo.", "Porque las palabras también pueden ser una forma de sentarse un rato junto a los recuerdos.", "Y porque todavía tengo muchas conversaciones por delante.", "Con mi familia. Con Sofi. Con las personas que aún no conozco.", "Incluso conmigo mismo, que a veces soy un interlocutor particularmente complicado."]}, "21": {"title": "El precio de querer resolverlo todo", "paras": ["Hay una diferencia entre ser responsable y sentirse responsable de absolutamente todo.", "Yo la descubrí después de intentar cruzarla varias veces.", "Me gusta ayudar. Si alguien tiene un problema y creo que puedo hacer algo, mi primera reacción suele ser buscar una solución. A veces funciona. Otras veces termino con una nueva tarea, menos horas de sueño y la sensación de que, si me detengo, todo se vendrá abajo.", "Es una sensación agotadora.", "En el trabajo hay cosas que deben hacerse bien. En un negocio también. Cuando uno administra dinero, pedidos o información de otras personas, no puede simplemente improvisar y esperar que la buena voluntad arregle los errores.", "Pero existe un punto en el que la responsabilidad deja de ser una forma de cuidado y empieza a convertirse en una exigencia imposible.", "Con EssGlow me entusiasmé tanto que a veces confundí mi deseo de construir algo bonito con la obligación de tenerlo listo inmediatamente. Quería que la página funcionara, que los vendedores entendieran sus comisiones, que Sofi no tuviera preocupaciones y que cada detalle estuviera bajo control.", "La realidad, por supuesto, no estaba interesada en colaborar con mi calendario.", "Y yo reaccionaba intentando trabajar más.", "No siempre era justo conmigo. Tampoco con quienes me rodeaban. Cuando uno está cansado, incluso una pregunta inocente puede sentirse como una presión enorme. Y entonces aparecen respuestas que no representan lo que realmente queremos decir.", "He tenido que reconocer que pedir tiempo no es abandonar un proyecto. Decir «hoy no puedo» no significa dejar de querer a alguien. Y admitir que necesito ayuda no me convierte en menos capaz.", "Hay problemas que puedo resolver. Otros requieren la participación de más personas. Y algunos necesitan esperar.", "La última categoría me cuesta especialmente.", "Porque esperar se parece demasiado a no hacer nada, y mi cerebro sospecha profundamente de cualquier actividad que no produzca resultados visibles.", "Pero descansar también es una decisión. Delegar también es una habilidad. Escuchar también es una forma de trabajar en equipo.", "Quiero aprender a construir sin sentir que todo depende de mí. Quiero que las personas que amo puedan acercarse sin encontrar siempre a alguien preocupado por una lista interminable de pendientes.", "Y quiero recordar que Sofi es mi pareja antes que mi compañera de cualquier proyecto.", "No necesito tener todas las respuestas para merecer una conversación tranquila con ella.", "A veces la solución más importante no es abrir otra hoja de cálculo.", "Es cerrar la computadora.", "Y preguntar: «¿Cómo estuvo tu día?»."]}, "22": {"title": "No todas las personas que atiendo saben quién soy", "paras": ["Trabajo vendiendo perfumes. Eso significa que una parte considerable de mi vida transcurre entre fragancias, preguntas, clientes y decisiones que deben tomarse con rapidez.", "Hay personas que llegan sabiendo exactamente qué quieren. Pronuncian el nombre del perfume, preguntan el precio y, si todo sale bien, se van satisfechas.", "Y hay otras que llegan buscando «algo rico».", "Una categoría olfativa extraordinariamente amplia.", "Uno aprende a hacer preguntas, a observar reacciones y a explicar diferencias sin convertir cada venta en una clase universitaria. También aprende que el buen servicio no consiste únicamente en vender algo. A veces consiste en escuchar y reconocer cuándo una fragancia no es la adecuada.", "Me gusta esa parte de mi trabajo. Hay satisfacción en ayudar a alguien a encontrar algo que realmente le guste.", "Pero los clientes conocen una versión muy específica de mí. Ven a la persona que atiende, cobra, resuelve una duda o busca una referencia. No saben necesariamente qué estaba pensando antes de entrar a la tienda.", "No saben que me gustan los tiburones. Que puedo emocionarme hablando de una motocicleta. Que tengo una lista de canciones extrañamente dramática. Que dibujo, que hago música o que una parte importante de mi vida ocurre en videollamadas con alguien que está en Colombia.", "Tampoco saben que hay días en los que llego cansado, preocupado o con la cabeza llena de cosas.", "Y eso me ha hecho pensar en algo: yo tampoco conozco la historia completa de las personas que atiendo.", "Detrás de cada pregunta sobre un perfume puede haber un regalo, una celebración, un recuerdo o alguien intentando recuperar la confianza después de un día difícil. No necesito conocer toda su vida para tratarla con respeto.", "A veces un buen servicio es simplemente eso. Un pequeño momento en el que alguien se siente escuchado.", "Claro que hay días complicados. Personas impacientes, sistemas que fallan y situaciones que exigen más paciencia de la que uno cree tener disponible.", "En esos momentos intento recordar que mi trabajo es importante, pero no define por completo quién soy.", "Soy responsable de hacerlo bien. No de convertir cada interacción en una evaluación de mi valor como persona.", "Quiero seguir aprendiendo del comercio y de la atención al cliente. Muchas de las cosas que sé sobre perfumes, ventas y organización las he aprendido trabajando.", "Pero también quiero seguir siendo alguien fuera de la tienda.", "Alguien que llega a casa, escucha música, habla con su novia y tiene derecho a pensar en algo que no sea una venta.", "Porque no todas las personas que atiendo saben quién soy.", "Y está bien.", "Lo importante es que yo no lo olvide."]}, "23": {"title": "Las cosas que nunca aprendí a decir", "paras": ["Hay frases que parecen sencillas hasta que uno intenta pronunciarlas.", "«Necesito ayuda».", "«Estoy cansado».", "«Eso me molestó».", "«No sé qué hacer».", "No son expresiones particularmente complicadas. No requieren un diccionario ni una explicación jurídica. Sin embargo, a veces me cuesta más decirlas que aprender una fórmula nueva de Excel.", "Quizá porque estoy acostumbrado a resolver cosas. Me gusta ser útil, encontrar respuestas y sentir que puedo manejar lo que aparece. Entonces, cuando algo me supera, mi primera reacción no siempre es contarlo. A veces intento arreglarlo antes de que alguien note que existe.", "El problema es que las emociones no funcionan como una motocicleta con la batería descargada. No siempre basta con encontrar la pieza correcta.", "A veces uno necesita que alguien escuche.", "Con Sofi he aprendido que querer a alguien no significa adivinarlo todo. Podemos conocernos mucho y aun así necesitar explicaciones. Ella no tiene por qué interpretar cada silencio mío. Yo tampoco debería construir conclusiones completas a partir de una frase que quizá entendí mal.", "Hablar a tiempo evita que pequeñas molestias se conviertan en historias enormes dentro de la cabeza.", "No siempre lo hacemos bien. Hay días en los que estamos cansados, en los que una palabra sale más dura de lo previsto o en los que necesitamos un rato antes de conversar. Pero eso no significa que hayamos dejado de querernos.", "Significa que seguimos aprendiendo a comunicarnos.", "También me cuesta aceptar los elogios. Si alguien me dice que hice algo bien, probablemente encuentre una manera de explicar qué podría mejorar. Si me agradecen un dibujo, señalo los errores. Si termino un proyecto, pienso en el siguiente.", "Estoy intentando cambiar eso.", "Aprender a decir «gracias» sin añadir una lista de defectos.", "Aprender a decir «no puedo hoy» sin sentir que he fallado.", "Aprender a decir «te extraño» sin convertirlo inmediatamente en un plan logístico para comprar boletos.", "Y, sobre todo, aprender a decir «te quiero» en días normales, cuando no existe una ocasión especial que justifique las palabras.", "Porque algunas cosas merecen decirse mientras todavía podemos hacerlo.", "Aunque no salgan perfectas.", "Especialmente entonces."]}, "24": {"title": "El extraño arte de crecer", "paras": ["Cuando era más pequeño, imaginaba que los adultos sabían lo que estaban haciendo.", "Tenían trabajos, documentos, responsabilidades y una manera de caminar que parecía indicar que comprendían el funcionamiento general del universo.", "Ahora tengo responsabilidades, documentos y trabajo.", "Y sigo preguntándome cómo funcionan muchas cosas.", "Una decepción considerable para la teoría original.", "Crecer no ocurrió de golpe. No hubo una ceremonia en la que alguien me entregara una carpeta con instrucciones. Simplemente comenzaron a aparecer decisiones que ya no podía dejar en manos de otra persona.", "Dinero que administrar. Horarios que cumplir. Problemas que resolver. Personas a las que responder. Planes que exigían paciencia.", "A veces me gusta sentir que puedo hacerme cargo. Otras veces quisiera que alguien me dijera exactamente cuál es el siguiente paso.", "Pero estoy aprendiendo que ambas sensaciones pueden existir al mismo tiempo.", "También he descubierto que crecer no significa abandonar las cosas que disfrutaba. Puedo tener un trabajo y seguir jugando videojuegos. Puedo hablar de negocios y emocionarme con una canción. Puedo tomar decisiones importantes y hacer preguntas absurdas sobre los yunques de las caricaturas.", "La madurez no debería obligarnos a convertirnos en personas aburridas.", "O, al menos, espero que no exista ninguna ley al respecto.", "Lo que sí cambia es la manera de relacionarnos con nuestros errores. Antes podía pensar que equivocarme demostraba que no era capaz. Ahora intento verlo como información. Algo que me ayuda a decidir mejor la próxima vez.", "No siempre funciona. Hay errores que duelen y consecuencias que no desaparecen porque uno haya aprendido una lección.", "Pero castigarme indefinidamente tampoco los arregla.", "Quiero ser una persona que asuma lo que le corresponde y que, al mismo tiempo, se permita empezar de nuevo.", "Pienso en mi papá, en las cosas que me enseñó. Pienso en mi mamá, en mi familia, en Sofi y en las personas que han estado presentes en distintas etapas de mi vida. Crecer también es reconocer cuánto hemos recibido de otros.", "No me hice solo.", "Y no tengo por qué hacerlo todo solo de ahora en adelante.", "Tal vez eso sea parte de convertirse en adulto: dejar de fingir que siempre sabemos la respuesta y aprender a elegir qué hacer incluso cuando tenemos dudas.", "Si alguien me pregunta cuándo voy a sentirme completamente grande, no sé qué responder.", "Quizá nunca.", "Pero mañana puedo ser un poco más paciente que hoy.", "Y, de momento, me parece una buena forma de crecer."]}, "25": {"title": "Lo que quiero ser cuando sea grande", "paras": ["Ya tengo una edad en la que se supone que debería poder responder qué quiero ser cuando sea grande.", "El problema es que todavía se me ocurren varias respuestas.", "Quiero construir una empresa que funcione bien. Quiero aprender más. Quiero dibujar mejor. Quiero hacer música. Quiero conocer lugares nuevos. Quiero tener tiempo para las personas que amo.", "Y, si es posible, también quisiera dormir ocho horas sin despertar con una idea de negocio.", "No parece una petición exagerada.", "Durante mucho tiempo pensé en el futuro como una lista de logros. Tener cierto trabajo, ganar cierta cantidad, comprar algunas cosas y llegar a un punto en el que pudiera decir que todo estaba resuelto.", "Ahora empiezo a sospechar que ese punto no existe.", "Siempre habrá algo nuevo que aprender, una decisión pendiente o una circunstancia que cambie los planes. Por eso quiero que mi idea de una buena vida no dependa exclusivamente de alcanzar una meta.", "Me gustaría construir algo estable. Poder ayudar a quienes quiero sin sentir que tengo que salvar el mundo cada mañana. Tener una casa donde la tranquilidad no sea un visitante ocasional.", "Quiero que EssGlow crezca, sí. Me emociona imaginar lo que podría convertirse en unos años. Pero quiero que crezca de una manera que nos permita disfrutar también del camino. Un negocio debería ayudarnos a vivir, no consumir cada conversación que tenemos.", "También quiero estudiar. Retomar proyectos que he dejado esperando. Aprender inglés. Seguir mejorando en cosas que me gustan simplemente porque me gustan.", "Y quiero viajar.", "Hay un lugar en Colombia al que deseo volver, pero también hay muchos otros que me gustaría descubrir. Algunos contigo. Otros quizá por trabajo, por curiosidad o por esa costumbre mía de pensar que conocer algo nuevo siempre vale la pena.", "Cuando imagino mi futuro contigo, no pienso únicamente en grandes acontecimientos. Me gusta pensar en una tarde cualquiera. En volver del trabajo, encontrar algo que cenar, hablar de nuestro día y decidir qué película ver.", "Me gusta la idea de una vida que no necesite ser espectacular para sentirse bonita.", "No sé si voy a conseguir todas las cosas que deseo. Algunas cambiarán. Otras quizá dejen de importarme. Y aparecerán sueños que todavía no conozco.", "Pero si algún día vuelven a preguntarme qué quiero ser cuando sea grande, quizá responda algo más sencillo:", "Quiero ser alguien que todavía tenga ganas de aprender, de querer y de empezar cosas bonitas.", "Y que, de vez en cuando, recuerde terminarlas."]}, "26": {"title": "Aprender a descansar sin sentir culpa", "paras": ["Descansar debería ser sencillo.", "Uno se sienta, deja de trabajar y permite que el cuerpo recupere fuerzas. Es un procedimiento que incluso un gato puede ejecutar con absoluta excelencia.", "Leo, por ejemplo, no parece sufrir ninguna crisis moral después de dormir varias horas. Se despierta, se estira y continúa con su vida como si acabara de cumplir una misión importante.", "Yo lo observo con admiración.", "Porque a mí me cuesta un poco más.", "Cuando tengo tiempo libre, mi cerebro suele presentar una lista de cosas que podría aprovechar para hacer. Corregir la página. Revisar inventarios. Practicar algo. Organizar archivos. Investigar una idea.", "Y si decido no hacer nada, aparece una voz incómoda que pregunta si no estaré desperdiciando el tiempo.", "Es una pregunta injusta.", "El descanso no es tiempo desperdiciado. Es parte de lo que necesitamos para seguir funcionando, pensar con claridad y disfrutar de las cosas que hacemos.", "Lo sé.", "Lo entiendo perfectamente.", "El problema es convencerme de aplicarlo.", "Hay días en los que llego cansado y todavía quiero resolver asuntos pendientes. Me digo que será solamente un momento. Una pequeña corrección. Un mensaje. Una revisión rápida.", "Dos horas después sigo frente a una pantalla.", "Y mañana me pregunto por qué estoy agotado.", "Una investigación verdaderamente misteriosa.", "Estoy aprendiendo que descansar no siempre significa dormir. A veces significa escuchar música sin hacer otra cosa. Jugar un rato. Dibujar sin una meta. Hablar con Sofi de algo que no sea trabajo. Salir a caminar cuando es seguro hacerlo. O simplemente estar tranquilo.", "También significa reconocer cuándo necesito acostarme.", "No tengo que ganarme el derecho a dormir terminando absolutamente todo. Siempre quedará algo pendiente. El mundo es muy eficiente produciendo tareas nuevas.", "Quiero tratarme con un poco más de paciencia. No exigirle a mi cuerpo que funcione como una máquina ni a mi cabeza que resuelva problemas sin descanso.", "Si quiero construir una vida bonita, tengo que estar presente para vivirla.", "Quizá algún día consiga acostarme sin pensar en una sola tarea.", "Y si no lo consigo, por lo menos puedo aprender a decirme:", "«Eso puede esperar hasta mañana».", "Leo estaría orgulloso.", "O seguiría durmiendo.", "Probablemente lo segundo."]}, "27": {"title": "Una casa con demasiadas reglas", "paras": ["Cuando imagino una casa contigo, siempre aparece un problema administrativo.", "¿Quién va a establecer las reglas?", "Porque tú estudias Derecho y yo tengo una relación peligrosamente cercana con las hojas de cálculo. Si no tenemos cuidado, podríamos terminar redactando un reglamento de convivencia con anexos, cláusulas y una tabla de seguimiento mensual.", "La regla número uno debería ser no redactar demasiadas reglas.", "Aunque reconozco que esa ya sería una regla.", "Me gustaría una casa donde hubiera espacio para nuestras cosas. Tus libros, mis dibujos, música, fotografías y quizá algún objeto que ninguno de los dos entienda por qué seguimos conservando.", "También necesitaríamos un lugar para Leo, suponiendo que él acepte la idea de compartir una vivienda que probablemente consideraría de su propiedad.", "Puedo imaginar pequeñas discusiones sobre el orden. Tú proponiendo organizar algo. Yo preguntando exactamente qué significa «organizar» en ese contexto. Ambos descubriendo que llevamos diez minutos hablando de un cajón.", "Pero me gusta pensar que sabríamos reírnos de eso.", "Una casa no debería ser un lugar donde todo tenga que estar perfecto. Debería ser un sitio donde podamos llegar cansados y sentir que estamos a salvo de las exigencias del día.", "Quiero que haya conversaciones tranquilas. Comidas improvisadas. Música mientras hacemos tareas normales. Una mesa donde podamos hablar de nuestros planes sin que cada charla termine convertida en una reunión empresarial.", "También quiero que podamos tener espacios propios. Que tú estudies, leas o descanses cuando lo necesites. Que yo dibuje, juegue o escuche música sin sentir que debemos hacer absolutamente todo juntos.", "Compartir una vida no significa dejar de ser dos personas.", "Significa aprender a encontrarnos cada día sin perder lo que nos hace únicos.", "Quizá no tengamos esa casa pronto. Hay decisiones, distancias y responsabilidades que todavía necesitan tiempo. No quiero convertir un sueño bonito en una exigencia que nos quite la tranquilidad.", "Pero me gusta imaginarlo.", "Me gusta pensar que algún día la frase «buenas noches» no viajará a través de una pantalla.", "Y que, cuando alguno de los dos diga «voy a ordenar el cuarto», el otro podrá decidir si ayuda o si aparece convenientemente con algo de comer.", "Yo propongo que ambas opciones sean legalmente válidas."]}, "28": {"title": "Las cosas que todavía no he hecho", "paras": ["Tengo una lista bastante larga de cosas que todavía no he hecho.", "No voy a escribirla completa porque existe el riesgo de que este capítulo se convierta en un plan de trabajo. Y ya hemos tenido suficiente de eso.", "Quiero conocer lugares nuevos. Mejorar mi inglés. Aprender técnicas de dibujo que todavía me parecen imposibles. Hacer música con más libertad. Viajar sin sentir que cada paso del aeropuerto es un examen sorpresa.", "Quiero volver a abrazar a Sofi.", "Esa última no es una experiencia completamente nueva, pero merece aparecer en todas las listas que hagan falta.", "Hay cosas que aún no he hecho porque no he tenido tiempo. Otras porque requieren dinero, preparación o decisiones que todavía no puedo tomar. Y algunas porque, aunque me interesan, me dan miedo.", "Durante mucho tiempo pensé que las oportunidades eran puertas que se cerraban para siempre si uno no las cruzaba a tiempo.", "Ahora intento recordar que la vida no es una competencia por completar experiencias.", "No necesito visitar todos los lugares este año. Ni dominar cada habilidad antes de cumplir cierta edad. Ni convertir cada deseo en una obligación.", "Puedo avanzar a mi ritmo.", "Eso no significa quedarme quieto. Significa elegir mejor dónde poner mi energía.", "Me gustaría aprender a disfrutar también de los comienzos. Ser malo en algo nuevo sin sentir vergüenza. Hacer preguntas sencillas. Equivocarme. Practicar. Descubrir que mejorar puede ser divertido cuando no lo convierto en una evaluación constante.", "También hay cosas pequeñas que quiero hacer. Preparar una comida rica para alguien. Terminar un dibujo y enmarcarlo. Pasar una tarde sin mirar el reloj. Tener una conversación larga con mi mamá. Leer un libro por placer.", "Y quiero guardar espacio para las sorpresas.", "Porque algunas de las cosas más importantes que me han ocurrido no estaban en ninguna lista.", "Conocer a Sofi, por ejemplo, no fue el resultado de un plan cuidadosamente organizado.", "Y mira todo lo que terminó significando.", "Quizá por eso no quiero escribir un futuro demasiado rígido. Prefiero dejar algunas páginas en blanco.", "No porque no tenga sueños.", "Sino porque todavía pueden aparecer sueños nuevos."]}, "29": {"title": "Lo que aprendí sin darme cuenta", "paras": ["Cuando comencé a ordenar mi cuarto, pensé que el problema principal serían los objetos.", "Había cosas fuera de lugar, recuerdos mezclados con artículos cotidianos y una cantidad de pequeñas decisiones que había estado posponiendo.", "No imaginaba que terminaría pensando tanto en mi vida.", "Al principio todo parecía bastante sencillo. Levantar algo, decidir dónde guardarlo y continuar. Pero algunos objetos tienen la mala costumbre de traer recuerdos. Una canción aparece en la cabeza. Una fotografía devuelve una tarde. Un detalle insignificante abre una conversación que creía olvidada.", "Y así, mientras intentaba hacer espacio, fui encontrando partes de mí.", "Recordé al muchacho que quería aprenderlo todo. Al que se emociona con una idea y olvida calcular cuánto tiempo necesitará. Al que disfruta vender perfumes, dibujar, hacer música y jugar videojuegos.", "Recordé un viaje que empezó con nervios y terminó regalándome uno de los abrazos más importantes de mi vida.", "Recordé a mi papá y las conversaciones que todavía me gustaría tener con él.", "También encontré cosas que no me resultaron tan cómodas. Mi costumbre de exigirme demasiado. La dificultad para pedir ayuda. El impulso de querer resolver problemas incluso cuando necesito descansar.", "No descubrí una solución mágica para todo eso.", "Pero quizá no hacía falta.", "A veces comprender algo es el primer paso para tratarlo de una manera distinta.", "Aprendí que puedo querer mucho a alguien y seguir necesitando tiempo para mí. Que un proyecto importante no debería ocupar cada rincón de mi vida. Que la responsabilidad también consiste en reconocer mis límites.", "Aprendí que no tengo que esperar a convertirme en una versión perfecta de mí mismo para disfrutar las cosas buenas que ya existen.", "Y aprendí que hay recuerdos que no necesitan estar guardados en una caja para permanecer conmigo.", "Algunos están en la música.", "Otros en una fotografía.", "Otros en la manera en que alguien dice mi nombre.", "Quizá el cuarto todavía no esté perfecto. Siendo sincero, no tengo mucha confianza en que alguna vez alcance un estado de organización absoluto. Leo, además, seguramente tendrá algo que opinar.", "Pero ahora miro el espacio de otra manera.", "No como una prueba de todo lo que me falta hacer.", "Sino como un lugar donde puedo comenzar de nuevo, una cosa a la vez."]}, "30": {"title": "Un lugar para cada cosa", "paras": ["Siempre me ha parecido curiosa la expresión «un lugar para cada cosa».", "Suena como una solución definitiva. Basta con asignar espacios, guardar los objetos correctamente y mantener el orden. En teoría, una habitación debería funcionar así para siempre.", "En la práctica, basta vivir en ella durante unos días para que aparezcan nuevos problemas.", "Una prenda sobre la silla.", "Un papel que necesito revisar.", "Un objeto que dejé cerca porque pensé utilizarlo después.", "Y, por supuesto, Leo, que considera cualquier superficie disponible una invitación personal.", "Pero mientras ordenaba comprendí que no todas las cosas de la vida pueden acomodarse de la misma manera.", "Hay recuerdos que quiero conservar cerca. Otros que puedo agradecer y dejar descansar. Hay preocupaciones que necesitan una solución y otras que solamente necesitan tiempo.", "También hay sueños que todavía no tienen un lugar definitivo.", "EssGlow es uno de ellos. Quiero seguir construyéndolo, pero sin permitir que ocupe todo el espacio reservado para nuestra relación, nuestra tranquilidad y las cosas que nos hacen felices.", "Mi trabajo merece esfuerzo. Mis estudios merecen atención. Mi familia merece tiempo. Mis proyectos creativos merecen un lugar, aunque no siempre produzcan algo útil.", "Y yo también merezco descanso.", "Me ha costado entenderlo porque durante mucho tiempo creí que organizar significaba conseguir que todo estuviera bajo control. Ahora pienso que quizá se trata de algo más amable: reconocer qué importa, qué puede esperar y qué ya no necesito cargar de la misma manera.", "No puedo cambiar algunas cosas del pasado. No puedo recuperar todas las conversaciones que me faltaron. Tampoco puedo hacer que la distancia desaparezca simplemente porque extraño a Sofi.", "Pero sí puedo decidir cómo vivir el día que tengo enfrente.", "Puedo hablar con las personas que quiero. Aprender algo nuevo. Equivocarme y corregir. Guardar un recuerdo bonito sin quedarme atrapado en él.", "Puedo seguir haciendo planes, pero también dejar espacio para que la vida me sorprenda.", "Pienso en esa fotografía donde le amarro los zapatos a Sofi. No había nada que organizar allí. Ningún objetivo extraordinario. Solo un momento pequeño que terminó ocupando un lugar enorme en mi memoria.", "Quizá eso sea lo que más quiero conservar de todo este proceso.", "La idea de que una vida bonita no se construye únicamente con grandes logros.", "También se construye con gestos sencillos, conversaciones tranquilas, canciones compartidas y la capacidad de estar presentes.", "Miro alrededor. Hay cosas que ya encontraron su sitio. Otras siguen esperando.", "No pasa nada.", "Mañana puedo continuar."]}, "CONCLUSIONES": {"title": "Resultados de una investigación doméstica", "paras": ["Después de una investigación extensa y de metodología cuestionable, he llegado a las siguientes conclusiones: primero, una habitación puede contener muchos más recuerdos de los que aparenta; segundo, Leo no reconoce ninguna autoridad en materia de organización; tercero, Excel no es un lenguaje del amor, aunque yo haya intentado demostrar lo contrario.", "También he descubierto que crecer no significa tener todo resuelto. Que aprender es más bonito cuando uno se permite equivocarse. Que pedir ayuda no me hace menos capaz y que descansar no debería producirme culpa.", "La conclusión más importante es otra: quiero seguir construyendo una vida donde quepan las personas que amo, las cosas que disfruto y las versiones de mí que todavía estoy conociendo.", "No todas las páginas futuras están escritas. Y me alegra que sea así."]}, "REFERENCIAS BIBLIOGRÁFICAS": {"title": "Edición doméstica, estilo APA aproximadamente séptima", "paras": ["Leo. (s. f.). Manual no autorizado para dormir sobre el pecho de un ser humano. Editorial Ronroneo.", "Sofía. (Comunicación personal, frecuente). Sobre el verbo «organizar» y sus múltiples aplicaciones en la vida cotidiana.", "Allan. (2026). Hojas de cálculo, planes de negocios y otros métodos para complicarse la existencia. Archivo personal.", "Aeropuertos de América Latina. (2026). Señales que probablemente eran claras para todo el mundo excepto para el autor. Observaciones de campo.", "CFMOTO. (2026). La importancia de una batería adecuada: estudio de caso con final feliz. Experiencia mecánica no arbitrada.", "Julio Jaramillo y otros artistas. (Varias fechas). Música para sentir cosas que uno no estaba buscando sentir. Discografía emocional del autor."]}, "APÉNDICE A": {"title": "Reglamento provisional para futuras ideas", "paras": ["Artículo primero. Toda idea nueva podrá ser anotada sin obligación de ejecutarse el mismo día.", "Artículo segundo. Queda prohibido abrir una hoja de Excel después de anunciar que uno va a dormir, salvo emergencia contable auténtica.", "Artículo tercero. Sofi tendrá derecho a preguntar «¿ya comiste?» sin que dicha consulta sea interpretada como una interrupción del proceso creativo.", "Artículo cuarto. Leo conserva el derecho de dormir donde quiera, aunque este artículo se encuentra pendiente de apelación."]}, "APÉNDICE B": {"title": "Glosario sentimental", "paras": ["Organizar: verbo que puede significar ordenar, planear, arreglar, preparar o casi cualquier otra actividad, según el contexto y la interpretación de Sofi.", "Laurel: manera de llamar a alguien que se ha convertido en un lugar importante de la vida del autor.", "Idea: fenómeno espontáneo capaz de transformar cinco minutos libres en tres semanas de trabajo.", "Regresar: volver a un lugar, pero también a una persona.", "Descansar: actividad necesaria que el autor se encuentra aprendiendo a practicar sin presentar justificación escrita."]}, "EPÍLOGO": {"title": "Buenas noches, Laurel", "paras": ["Hay una hora en la que las habitaciones empiezan a sentirse distintas. Los sonidos se vuelven más pequeños, las cosas parecen quedarse quietas y uno descubre que el día, con todas sus complicaciones, finalmente está terminando.", "Me gusta pensar que este libro nació de un intento sencillo de poner un poco de orden. No imaginaba que terminaría recorriendo tantos recuerdos ni encontrando tantas preguntas en el camino.", "Escribí sobre cosas que me hacen reír. Sobre una motocicleta que volvió a encender. Sobre canciones, dibujos, clientes, videojuegos y una cantidad bastante preocupante de ideas.", "También escribí sobre lo que extraño, sobre lo que todavía me cuesta y sobre las personas que han dejado algo importante en mí.", "Y escribí sobre ti.", "No porque seas la respuesta a todas mis preguntas ni porque tengas que resolver lo que yo todavía estoy aprendiendo. Escribí sobre ti porque me gusta compartir mi vida contigo. Porque hay momentos pequeños que se vuelven especiales cuando los vivimos juntos. Porque después de tantos kilómetros, llamadas y planes, sigo encontrando motivos para querer conocerte más.", "No sé cómo serán todos nuestros días. Seguramente habrá cansancio, desacuerdos, cambios y planes que debamos ajustar. También espero que haya viajes, comidas compartidas, fotografías espontáneas y muchas conversaciones que empiecen sin ningún tema.", "Quiero que podamos seguir siendo nosotros, incluso mientras aprendemos a crecer.", "Esta noche no necesito resolver el futuro. Tampoco necesito terminar todas las tareas pendientes ni encontrar una respuesta para cada cosa que me preocupa.", "Por ahora voy a descansar. Quiero despertar, atender lo que me corresponda sin exigirme imposibles y seguir buscando maneras de estar mejor. Quiero volver a reír contigo, volver a abrazarte cuando podamos y seguir escribiendo días que no necesiten un libro para ser especiales.", "Buenas noches, mi Laurel. Te amo muchísimo.", "Y si te preguntas qué estuve haciendo mientras intentaba encontrar todas estas palabras, la respuesta es sencilla: hoy ordené mi cuarto."]}};
// Compose denser pages by word count, keeping paragraphs intact and titles breathable.
function paginate(paras){
 const result=[];let page=[],words=0;
 for(const paragraph of paras){
  const count=paragraph.trim().split(/\s+/).length;
  const target=result.length===0?155:205;
  if(page.length>=3 && (words+count>target || page.length>=7)){
   result.push(page);page=[];words=0;
  }
  page.push(paragraph);words+=count;
 }
 if(page.length){
  // Avoid a nearly empty last leaf when the preceding leaf has space.
  if(result.length && words<65 && result[result.length-1].reduce((n,p)=>n+p.trim().split(/\s+/).length,0)+words<245){result[result.length-1].push(...page)}
  else result.push(page);
 }
 return result;
}
const revisedFirstChapters={"1":["Hay personas que encuentran paz cuando todo está perfectamente acomodado. Yo encuentro paz cuando sé dónde dejé mis cosas, aunque ese lugar no figure en ningún manual de organización doméstica.","Mi cuarto es una especie de archivo histórico. En una esquina hay algo que usé ayer; en otra, un objeto que juré guardar hace tres meses. Sobre alguna superficie descansan ideas que empezaron siendo pequeñas y terminaron reclamando presupuesto, atención y una carpeta en la computadora.","Decir que voy a ordenar mi habitación parece una decisión sencilla. Uno recoge la ropa, guarda lo que no utiliza, limpia el polvo y abre la ventana. Eso suponía yo. El problema aparece cuando encuentro una cosa que tiene memoria.","Una hoja con un dibujo me obliga a recordar por qué lo hice. Un recibo me devuelve a una tarde complicada. Un cable que ya no sé de qué aparato era provoca una investigación innecesaria. Y una fotografía consigue suspender por completo la operación de limpieza.","Entonces me siento en la cama y pienso en lo extraño que resulta conservar tantas versiones de uno mismo en un espacio relativamente pequeño. El que compró algo por entusiasmo, el que llegó agotado después de trabajar, el que intentó aprender una canción, el que soñó con viajar y el que volvió de ese viaje siendo ligeramente distinto.","Si hiciera un inventario, debería añadir una categoría llamada «cosas que no pesan pero ocupan mucho espacio». Allí entrarían las preocupaciones, los planes, las conversaciones que me gustaría repetir y esas preguntas que aparecen justo cuando debería estar durmiendo.","También tendría que reservar un lugar para Leo, mi gato, cuya contribución a la organización consiste en acostarse exactamente encima de aquello que necesito mover. Él no ve el desorden como un problema. Lo ve como un conjunto de oportunidades para dormir.","Comencé a ordenar creyendo que necesitaba hacer espacio en los cajones. Terminé sospechando que lo que verdaderamente necesitaba era detenerme a mirar lo que había ido dejando en el camino. Por eso existe este libro. Porque, aparentemente, ni siquiera limpiar mi cuarto puedo hacerlo sin convertirlo en un proyecto."],"2":["Organizar es una palabra peligrosa. Suena responsable. Suena adulta. Da la impresión de que la persona que la pronuncia sabe exactamente qué hará a continuación.","En mi vida la palabra aparece en circunstancias muy variadas: organizar un inventario, organizar las ventas, organizar una videollamada, organizar el día y, de ser posible, organizar también la manera en que uno deja de pensar antes de acostarse.","Sofi tiene una habilidad especial para utilizarla. Podemos estar hablando de algo tan sencillo como decidir qué haremos mañana y, tarde o temprano, surge la propuesta de organizarnos. Lo dice con esa naturalidad que hace parecer posible acomodar cualquier problema dentro de una lista.","Yo, por supuesto, intento colaborar. Abro notas, hago cálculos, busco alternativas y comienzo a imaginar un sistema con columnas de colores. Cuando ella esperaba una conversación de cinco minutos, yo ya estoy diseñando el procedimiento de implementación.","En defensa propia debo aclarar que la organización me gusta. Mi relación con ella es complicada, pero sincera. Me encanta ver un plan funcionando. Me emociona que los números cuadren y que una idea, después de varios intentos, finalmente tenga forma.","Lo que todavía no domino es distinguir entre organizar las cosas y querer controlarlas. Hay días en los que un calendario ayuda. Otros necesitan una conversación sin horario. Hay sentimientos que no mejoran porque uno les asigne una fecha de resolución.","Con la distancia aprendimos que organizarnos es útil. Guatemala y Montería no se acercan por voluntad propia, así que toca encontrar momentos, hacer espacio entre responsabilidades y aprender que dos rutinas diferentes pueden encontrarse.","Pero también he descubierto que algunas de las mejores llamadas comienzan sin un propósito. Preguntamos cualquier tontería, nos reímos, nos quedamos callados y, cuando miramos la hora, el tiempo se ha ido sin pedir permiso.","Quizá esa sea la definición de organizar que más me interesa: preparar la vida lo suficiente para que todavía quepan las cosas que no planeamos. Incluido este libro, que nació durante una limpieza y se negó rotundamente a comportarse como una simple tarea doméstica."],"3":["Una relación a distancia suele tener dos protagonistas. En nuestro caso hay un tercero que no pidió permiso para participar y, sin embargo, aparece en casi todas las escenas importantes.","Se llama Leo. Es un gato. No paga internet, no comprende los horarios y considera que cualquier superficie cercana a mi pecho le pertenece por derecho histórico.","Las videollamadas con Sofi han demostrado que se puede hablar de asuntos muy serios mientras un animal decide caminar frente a la cámara. También han demostrado que resulta difícil conservar la dignidad cuando alguien intenta acomodarse encima de tu cara.","En ocasiones Sofi está contándome algo de su día y yo hago un esfuerzo legítimo por escuchar. Entonces Leo se estira, empuja algo con una pata o adopta una posición que desafía las leyes de la comodidad. Me distraigo un segundo. Ese segundo, naturalmente, queda registrado.","Él parece convencido de que nuestras llamadas existen para proporcionarle compañía. Si hablamos bajo, duerme. Si nos reímos, abre un ojo con evidente desaprobación. Si necesito levantarme, su peso aumenta misteriosamente.","Sofi ha llegado a conocer detalles de mi habitación a través de una pantalla. La luz que entra, el lugar donde suelo sentarme y los movimientos de un gato que ha desarrollado una presencia casi contractual en nuestra relación.","Me gusta esa clase de intimidad cotidiana. No consiste únicamente en decirse cosas bonitas. También se construye cuando la otra persona sabe cómo se ve tu día normal, cómo suena tu cansancio y qué ocurre detrás de ti mientras hablas.","Durante mucho tiempo pensé que los momentos importantes tenían que parecer importantes. Un viaje, una fecha, una fotografía. Ahora sé que también puede ser importante una llamada común en la que Sofi se ríe porque Leo ha decidido apropiarse de la escena.","Si alguna vez escribimos las reglas de nuestra casa, seguramente incluirán una disposición sobre los lugares donde se permite dormir al gato. Estoy bastante seguro de que Leo no reconocerá la autoridad de ese documento."],"4":["Siempre he tenido una teoría sobre mí mismo: si alguien más puede aprender a hacer algo, probablemente yo también.","El problema es que a veces confundo «puedo aprenderlo» con «seguramente puedo hacerlo esta misma tarde».","Y así es como empiezan aproximadamente el ochenta por ciento de mis problemas.","El otro veinte por ciento comienza cuando digo: «Tengo una idea».","Aprender por cuenta propia es una costumbre que agradezco. Me ha permitido dibujar sin haber pasado por una academia, resolver problemas en la computadora, entender cuentas y descubrir habilidades que no sabía que podía desarrollar.","Pero tiene una consecuencia curiosa: cuando algo falla, la primera persona a la que acudo para solucionarlo suelo ser yo mismo. Si no sé cómo hacerlo, lo investigo. Si no funciona, pruebo otra vez. Si aparece un obstáculo nuevo, me convenzo de que también debo superarlo.","En el trabajo eso puede ser útil. En un proyecto propio, incluso necesario. En la vida personal, a veces termina siendo agotador. Hay noches en las que no necesito una solución brillante sino aceptar que estoy cansado.","No todo merece convertirse en una prueba de capacidad. Que yo pueda aprender algo no significa que deba aprenderlo ahora. Que sea capaz de ayudar no significa que tenga que cargar con absolutamente todas las responsabilidades.","Con Sofi he tenido que descubrir otra forma de valentía: explicar cuando una tarea me supera, escuchar sin preparar inmediatamente una respuesta técnica y recordar que estamos construyendo una relación, no presentando un examen de eficiencia.","Me sigue gustando resolver problemas. Me gusta esa sensación maravillosa de que algo, finalmente, funciona. Lo que intento cambiar es la idea de que mi valor depende de conseguirlo a la primera.","Tal vez crecer también sea aprender a decir: «Esto puedo hacerlo, pero no hoy». Y después dormir tranquilo, incluso si todavía hay algo esperando en la lista."],"5":["Si alguien revisara mi computadora, probablemente encontraría pruebas suficientes para concluir que tengo una relación sentimental con Excel. No una relación estable, necesariamente, pero sí una que ocupa demasiadas horas de mi vida.","Me gustan sus celdas, las fórmulas que resuelven problemas y la promesa seductora de que cualquier situación puede volverse manejable si encontramos las columnas correctas.","Cuando empezamos a pensar en EssGlow, un inventario sencillo parecía suficiente. Después aparecieron los costos, los precios de venta, las comisiones, los proveedores, los envíos y una cantidad considerable de decisiones que necesitaban su propia hoja.","De pronto el archivo tenía más pestañas de las que una persona razonable debería consultar después de una jornada laboral. Y yo seguía agregando funciones, convencido de que la siguiente sería la última.","Excel tiene una manera particular de enseñarte humildad. Puedes dedicar horas a construir una fórmula elegante y descubrir, en el momento menos oportuno, que todo depende de una referencia mal puesta. Una celda cambia, los resultados desaparecen y uno empieza a negociar verbalmente con la computadora.","Hay algo hermoso, sin embargo, en ver cómo los números se convierten en decisiones reales. Si sabemos cuánto cuesta adquirir una fragancia, cuánto debemos reservar para los gastos y qué utilidad queda, podemos tomar mejores decisiones sin depender únicamente del entusiasmo.","El problema comienza cuando pretendo aplicar el mismo método a todo. No existe una fórmula que determine cuánto necesita descansar alguien. Tampoco una función que convierta una conversación difícil en un resultado perfecto.","Sofi estudia Derecho. Yo me refugio en tablas. Sospecho que en alguna discusión futura ella citará un artículo y yo intentaré presentar una hoja de cálculo. Quien observe la escena deberá decidir si se trata de una relación romántica o de una audiencia extraordinariamente mal organizada.","Quiero que EssGlow funcione, claro. Quiero que crezca y que el esfuerzo tenga sentido. Pero también quiero cerrar el archivo a una hora razonable, preguntarle a Sofi cómo estuvo su día y escuchar la respuesta sin estar pensando en la columna siguiente.","En conclusión, Excel es una herramienta maravillosa. Solo conviene recordar que, cuando termina el horario de trabajo, la vida continúa fuera de sus bordes."],"6":["Hay una pregunta que probablemente muchas personas se hacen cuando llegan a cierta edad: «¿Qué estoy haciendo con mi vida?».","Yo también me la he hecho.","Solo que, en algunas ocasiones, la respuesta ha sido: «Esperando a que termine de mejorarse el Rey Bárbaro».","Jugar Clash of Clans me ha enseñado algo que parece sencillo y que, sin embargo, me cuesta aplicar a los asuntos importantes: algunas mejoras necesitan tiempo. No importa cuánto mire la pantalla. El contador seguirá avanzando a su ritmo.","Mi aldea puede estar razonablemente organizada, pero siempre aparece alguna defensa pendiente o un héroe que requiere otra mejora. Y entonces surge la tentación de quedarme despierto un rato más para hacer una cosa adicional.","Me causa gracia que pueda tener paciencia con un temporizador digital y desesperarme porque mis proyectos personales no progresan con la misma velocidad que imagino.","También juego League of Legends. Allí he aprendido que uno puede entrar con un plan muy claro y salir preguntándose por qué tuvo que depender de otras cuatro personas. Amumu, mi compañero habitual en la jungla, comprende bastante bien la tristeza, aunque no siempre comprenda las decisi
