ones de mi equipo.","Los videojuegos son una forma de descansar, competir, distraerme y, a veces, compartir un poco de mi mundo. No me hacen olvidar mis responsabilidades. Me recuerdan que no todo lo que hago tiene que producir dinero, mejorar un negocio o demostrar algo.","Lo difícil es saber detenerse. «Una partida más» tiene un parentesco sospechoso con «solo voy a corregir una cosa en la página web». Ambas frases pueden significar que dormiré mucho más tarde de lo previsto.","Sofi probablemente podría presentar evidencia abundante sobre mis horarios. Yo alegaría que estaba esperando a que terminara una mejora. El tribunal, compuesto por ella y por mi propia conciencia, seguramente declararía improcedente la excusa.","Al final, ni la aldea ni el mundo van a desaparecer porque cierre los ojos. El Rey Bárbaro puede terminar de mejorar sin que yo lo supervise. Ese descubrimiento debería valer, por lo menos, unas cuantas horas de sueño."],"7":["Hay algo curioso en trabajar vendiendo perfumes.","Uno pasa buena parte del día ayudando a otras personas a encontrar algo que les guste.","Y mientras uno escucha lo que buscan los demás, a veces se olvida de preguntarse qué está buscando uno mismo.","Yo, por ejemplo, estaba buscando una empresa.","Trabajo rodeado de fragancias. Algunas personas llegan con una idea clarísima de lo que quieren. Otras piden algo fresco, elegante, dulce o parecido a un perfume cuyo nombre recuerdan a medias. Me toca escuchar, comparar y convertir descripciones vagas en una recomendación concreta.","Me gusta pensar que una buena venta no consiste únicamente en entregar un producto. Tiene que ver con prestar atención. Con comprender que quien está enfrente tiene un presupuesto, una ocasión y un gusto que merecen respeto.","Entre turnos largos y responsabilidades empecé a imaginar algo propio. No quería limitarme a hablar de emprender como si fuera una palabra bonita. Quería construir una tienda, aprender cómo sostenerla y ofrecer una experiencia de la que pudiera sentirme orgulloso.","Así nació EssGlow, con una mezcla de ilusión y hojas de cálculo. Una idea que empezó hablando de perfumes y pronto necesitó una página web, proveedores, un catálogo y conversaciones sobre cómo vender en dos países.","Sofi y yo no estábamos siempre en el mismo lugar, pero sí podíamos compartir un proyecto. Eso tenía algo emocionante: trabajar para que la distancia no fuera la única protagonista de nuestros planes.","También fue una lección. Un negocio puede acercar a dos personas cuando sueñan juntas, pero puede ocupar demasiado espacio si cada llamada termina convertida en reunión. Tuve que recordarme que Sofi era mi pareja antes que cualquier cargo que pudiéramos escribir en un organigrama.","Quiero que quienes compren en EssGlow reciban algo más que una fragancia original. Quiero que encuentren atención, claridad y el tipo de confianza que hace que una persona regrese sin sentirse presionada.","Todavía estoy aprendiendo. Hay mucho que revisar antes de considerar que el proyecto funciona solo. Pero una cosa ha cambiado: ya no veo la idea de tener una empresa como un sueño que pertenece exclusivamente al futuro. Es algo que empezó en pequeño y que podemos construir con calma, una decisión correcta a la vez."],"8":["Hay pocas cosas tan bonitas como escuchar el motor de una motocicleta que te gusta.","Y hay pocas cosas tan desesperantes como intentar encenderla y descubrir que ha decidido no colaborar.","Mi CFMOTO y yo tenemos una relación bastante particular.","Yo la quiero. Ella, aparentemente, considera que el cariño debe demostrarse mediante pruebas constantes de paciencia.","Hubo días en que el tablero se comportaba de una manera extraña y el motor parecía dispuesto a intentar arrancar sin llegar a conseguirlo. Comprobé cosas, hice preguntas, consideré posibilidades y pasé demasiado tiempo mirando una máquina que, por supuesto, no iba a responderme.","Una falla de batería puede parecer un asunto pequeño cuando uno lo cuenta después. Mientras ocurre, sin embargo, el problema crece. Hay transporte que resolver, gastos que calcular y la desagradable sensación de no saber cuánto costará volver a escuchar el motor.","En un momento llegué a considerar reparaciones mucho más caras de lo que finalmente resultó necesario. Pensaba en presupuestos, en alternativas y hasta en la posibilidad de cambiar de moto.","Al final, una batería adecuada devolvió la vida a mi CFMOTO. El costo terminó siendo mucho menor del que había temido. Cuando volvió a encender, sentí una tranquilidad desproporcionada para alguien que supuestamente solo había resuelto un problema mecánico.","Después la lavé. Parecía justo celebrar su regreso y, de paso, comprobar que seguía siendo tan bonita como la recordaba.","Me he dado cuenta de que a veces confundimos una dificultad con el final de las cosas. Algo deja de funcionar, el miedo se adelanta y nuestra imaginación calcula la peor de las posibilidades antes de tener todos los datos.","Con la moto aprendí a preguntar, revisar y no declarar perdido aquello que todavía puede repararse. Sé que la vida no siempre se arregla instalando una batería, pero aquella tarde me gustó mucho que, por una vez, la solución fuera tan concreta.","Volví a escuchar el motor y pensé que todavía nos quedaban bastantes kilómetros por recorrer."],"9":["Tengo una teoría: hay canciones que deberían pedir permiso antes de describir la vida de uno con tanta precisión.","Porque no es normal estar tranquilamente escuchando música y que, de pronto, alguien que jamás te ha conocido consiga explicar algo que llevabas semanas intentando entender.","Me ocurre con canciones distintas en momentos diferentes. Algunas me devuelven energía cuando el día ha sido pesado. Otras me obligan a recordar a alguien, una conversación o una etapa de mi vida que creía guardada en un lugar bastante seguro.","Escucho música de estilos diversos. Puedo pasar de una canción que parece escrita para una carretera larga a otra que invita a quedarse inmóvil mirando el techo. No siempre elijo lo que combina con mi estado de ánimo; a veces dejo que la canción lo cambie.","También me gusta hacer música. Hay algo muy diferente entre escuchar una melodía y tratar de encontrarla con las propias manos. Al principio aparecen errores, notas que no corresponden, ritmos que se escapan. Luego, por unos segundos, todo coincide.","Pienso que una canción funciona como una pequeña cápsula del tiempo. Podemos escucharla años después y descubrir que todavía recuerda por nosotros el color de una tarde o el sentimiento que acompañaba un viaje.","Con Sofi algunas canciones han empezado a adquirir significados que antes no tenían. La distancia cambia la manera de escuchar: de pronto una letra sobre esperar, encontrarse o regresar suena como si hubiera estado pendiente de nuestra agenda.","No quiero que toda mi música sea nostalgia. También quiero canciones para cocinar juntos, para viajar en moto, para celebrar algo pequeño y para esos días tranquilos que todavía no hemos vivido.","Quizá por eso guardo canciones como guardo papeles y dibujos. No porque todas sean importantes para siempre, sino porque algunas se convierten en lugares a los que puedo volver sin comprar un boleto.","Si este libro tuviera una banda sonora, sería bastante difícil organizarla. Cambiaría de género sin aviso y seguramente incluiría una canción que Sofi pediría repetir. En ese punto, por supuesto, yo dejaría de discutir."],"10":["Hay una pregunta que siempre me ha parecido un poco complicada: «¿Tú eres artista?».","Porque depende.","Si me preguntan si me gusta dibujar, la respuesta es sí.","Si quieren saber si estudié años en una academia o si tengo una exposición preparada, la conversación se vuelve un poco más incómoda. Aprendí muchas cosas por mi cuenta. Busqué referencias, hice pruebas y llené hojas de intentos que no siempre terminaron como esperaba.","El dibujo tiene una cualidad que me gusta: obliga a mirar. No basta con saber que una mano tiene cinco dedos. Hay que entender cómo se dobla, dónde aparece la sombra y qué pequeños detalles hacen que reconozcamos un gesto.","Me he descubierto dibujando cosas que quiero conservar. No porque una fotografía sea insuficiente, sino porque al dibujar permanezco más tiempo con aquello que estoy observando.","A veces una línea queda torcida. A veces los ojos no coinciden. Y a veces, sin entender del todo cómo, una imagen empieza a parecerse a lo que tenía en mente. Esos momentos me recuerdan que practicar algo también es una forma de tener paciencia conmigo mismo.","Sofi ha visto partes de ese mundo. Me gusta imaginar que algún día encontraré tiempo para dibujarla sin prisa, no buscando una imagen perfecta, sino tratando de registrar esa manera particular que tiene de mirarme cuando me río de algo absurdo.","No todo lo que creamos necesita convertirse en producto, publicación o ingreso. Algunas cosas merecen existir solamente porque disfrutamos haciéndolas.","Tal vez algún día me resulte sencillo decir «soy artista» sin sentir que debo presentar pruebas. Mientras tanto, seguiré dibujando, escuchando música y aprendiendo. A fin de cuentas, nadie puede quitarme el placer de hacer algo con mis propias manos."],"11":["Tengo un problema con las preguntas.","No con responderlas.","Con hacerlas.","Porque mi cerebro tiene la costumbre de interesarse por asuntos que, hasta cinco segundos antes, no tenían ninguna relación con mi vida.","Una vez puedo estar pensando en perfumes y, de pronto, necesito saber cómo descubren los doctores que un bebé no ve bien. Otra tarde recuerdo un yunque cayendo en una caricatura y termino investigando por qué ese objeto llegó a convertirse en símbolo universal de los golpes imposibles.","Me ocurre también con palabras. ¿Qué hace exactamente un ebanista? ¿En qué se diferencia una jurisprudencia de una ley? ¿Por qué algunos conceptos parecen más difíciles de explicar cuanto más veces se repiten?","Si se trata de filosofía, el asunto empeora. Basta con que alguien mencione si el ser humano nace bueno o malo para que mi cerebro organice un debate al que nadie lo invitó.","Sofi estudia Derecho, así que a veces encuentro nuevas preguntas en su mundo. Recuerdo haber oído hablar del juez Hércules de Dworkin y pensar que semejante nombre prometía una aventura mitológica, cuando en realidad nos llevaba a discutir cómo interpretar casos jurídicos difíciles.","Lo divertido es que una pregunta conduce a otra. Empiezo buscando una definición y termino leyendo sobre historia, medicina o costumbres de lugares que nunca he visitado.","Con los años he comprendido que no necesito encontrar una utilidad inmediata para cada curiosidad. Saber algo porque me parece interesante ya es una razón suficiente.","Aun así, existe una norma que debería respetar con más frecuencia: no iniciar investigaciones extensas cuando estoy a punto de dormir. La norma cuenta con amplia justificación y un historial igualmente amplio de incumplimientos.","Me gusta conversar de estas cosas con Sofi. A veces se ríe, a veces responde con una lógica impecable y otras veces me mira como si intentara determinar cómo llegamos de una conversación romántica a un análisis jurídico de un yunque.","Supongo que así funciona mi cabeza. Desordenada, curiosa y empeñada en abrir una puerta nueva antes de cerrar la anterior. Me alegra que este libro también haya encontrado espacio para esa parte de mí."]};
const entries=[];
entries.push({kind:'cover',title:'Portada'});

entries.push({kind:'dedication',title:'Dedicatoria',paras:[
'Para Sofi.',
'Porque de todas las cosas inesperadas que han llegado a mi vida, tú eres una de las pocas que jamás he querido devolver a su lugar.',
'Y porque, aunque probablemente habrías terminado de organizar esta habitación mucho antes que yo, sospecho que nos habríamos distraído juntos a mitad del trabajo.'
]});
entries.push({kind:'thanks',title:'Agradecimientos',paras:[
'Este libro comenzó, como muchas de mis mejores y peores ideas, con la convicción de que haría algo sencillo. Iba a ordenar mi cuarto. En algún momento apareció una frase, luego un recuerdo, y cuando quise darme cuenta ya estaba escribiendo agradecimientos para una obra que nadie había solicitado.',
'A mi mamá, por acompañarme incluso durante las etapas en las que mi manera de organizar la vida se parece demasiado a mi manera de organizar esta habitación. Hay esfuerzos cotidianos que uno empieza a comprender mejor cuando crece. Gracias por los tuyos.',
'A mi papá, por las palabras y las enseñanzas que todavía encuentro en mí. Ojalá pudiéramos sentarnos a conversar de tantas cosas nuevas. Hay recuerdos que no se guardan en un cajón porque forman parte de quien uno es.',
'A Sofi, por las llamadas, las risas y la paciencia con todas las veces que dije «tengo una idea» y eso terminó convirtiéndose en una explicación excesivamente larga. Gracias por dejarme conocerte también en los días comunes. Este libro es para ti, pero no pretende explicarte: todavía quiero seguir descubriéndote.',
'A Leo, mi gato, por supervisar el proceso de escritura, interrumpir reuniones imaginarias y demostrar que cualquier objeto puede convertirse en cama si uno tiene suficiente determinación.',
'A quienes dudaron de alguna de mis ideas, porque a veces tenían razón y otras veces me obligaron a pensar mejor. Y a mí mismo, por haber seguido aprendiendo, incluso cuando no tenía todas las respuestas.',
'Finalmente, gracias a quien haya abierto este libro esperando encontrar instrucciones para ordenar una habitación. Lamento informar que, aunque se han recogido algunos objetos, la metodología propuesta aquí no ha sido evaluada por ninguna autoridad doméstica competente.'
]});
entries.push({kind:'abstract',title:'Resumen',paras:[
'La presente obra examina un fenómeno doméstico de complejidad creciente: el intento de un joven por ordenar su habitación y la inesperada aparición de treinta capítulos sobre su vida. A partir de observaciones de campo, recuerdos personales y un número científicamente cuestionable de digresiones, se exploran el trabajo, los proyectos, las motocicletas, la música, el duelo, los videojuegos y las particularidades de amar a alguien a más de mil kilómetros de distancia.',
'Los resultados sugieren que el desorden no siempre consiste en objetos fuera de lugar. En ocasiones, también designa pensamientos que necesitan ser escuchados, planes que requieren paciencia y sentimientos que no caben dentro de una hoja de cálculo.',
'Se concluye que poner cada cosa en su sitio no implica tener resuelta la vida. A veces significa, sencillamente, hacer espacio para seguir viviéndola.',
'Palabras clave: organización, amor a distancia, memoria, motocicletas, Excel, Leo, Sofi.'
]});
entries.push({kind:'index',title:'Índice',paras:[]});
entries.push({kind:'prologue',title:'Instrucciones para leer un libro que nadie me pidió escribir',paras:[
'Antes de comenzar debo informar que este libro no incluye un método certificado para ordenar habitaciones. Quien lo utilice con ese propósito podría terminar pensando en su infancia, una motocicleta o una persona que vive en Colombia. El autor no se hace responsable de las distracciones derivadas.',
'No hace falta leerlo con una libreta al lado. No hay examen al terminar, aunque algunas notas al pie intenten sugerir lo contrario.',
'Es una historia sobre las cosas que uno encuentra mientras intenta poner un poco de orden: recuerdos, ideas, preguntas y personas que han cambiado la manera de mirar el mundo.',
'No todos los capítulos son igualmente serios. Algunos nacieron de una pregunta absurda; otros, de cosas que todavía me cuesta decir. Quise conservar ambas clases de recuerdos porque ambas forman parte de mí.',
'Si en algún momento parece que el autor está a punto de abrir Excel, se recomienda pasar la página con rapidez.',
'Y si estás leyendo esto, Laurel, no busques un mensaje oculto de despedida. Lo que encontrarás es exactamente lo contrario: un intento de contar quién soy mientras sigo pensando en todas las cosas que todavía quiero compartir contigo.'
]});
for(let n=1;n<=30;n++){
 const ch=chapters[n-1], data=newContent[String(n)];
 const paras=data?.paras||revisedFirstChapters[n]||excerpts[n]||['Capítulo en preparación'];
 const chunks=paginate(paras);
 chunks.forEach((chunk,i)=>entries.push({kind:'chapter',chapter:n,title:ch.title,part:ch.part,paras:chunk,partial:false,pageNum:i+1}));
}
for(const k of ['CONCLUSIONES','REFERENCIAS BIBLIOGRÁFICAS','APÉNDICE A','APÉNDICE B','EPÍLOGO']){
 const data=newContent[k]; if(!data)continue;
 paginate(data.paras).forEach((chunk,i)=>entries.push({kind:'end',title:data.title,section:k,paras:chunk,pageNum:i+1}));
}

/* El índice también forma parte del libro impreso: 5 secciones, con paginación real. */
const tableIndex=entries.findIndex(e=>e.kind==='index');
const headingEntries=groups.map(([part,titles],groupId)=>({
 kind:'index',title:'Índice',pageNum:groupId+1,paras:[
  part.toUpperCase(),
  ...titles.map((title,i)=>{
    const number=groups.slice(0,groupId).reduce((v,g)=>v+g[1].length,0)+i+1;
    const first=entries.findIndex(e=>e.chapter===number);
    return String(number).padStart(2,'0')+' · '+title+' — pág. '+String(first).padStart(3,'0');
  })
 ]
}));
headingEntries[4].paras.push('AL CERRAR EL LIBRO');
for(const k of ['CONCLUSIONES','REFERENCIAS BIBLIOGRÁFICAS','APÉNDICE A','APÉNDICE B','EPÍLOGO']){
 const e=entries.findIndex(x=>x.section===k);
 if(e>=0)headingEntries[4].paras.push(entries[e].title+' — pág. '+String(e).padStart(3,'0'));
}
entries.splice(tableIndex,1,...headingEntries);
/* Recalcular páginas del índice después de insertarlas. */
const insertedPages=headingEntries.length-1;
headingEntries.forEach(entry=>{
 entry.paras=entry.paras.map(p=>p.replace(/(pág\. )(\d{3})$/,(_,prefix,n)=>prefix+String(Number(n)+insertedPages).padStart(3,'0')));
});
let current=0;
const book=document.getElementById('book');
const esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
const mobile=()=>window.matchMedia('(max-width:700px)').matches;
// Each entry is a real printed page. On desktop two consecutive pages form a spread.
// The cover is separate; after it, every navigation advances one full spread.
const pages=entries.slice(1);
const spreads=[{cover:true}];
for(let i=0;i<pages.length;i+=2)spreads.push({left:pages[i],right:pages[i+1]||null,leftIndex:i});
function pageMarkup(item,side,index){
 if(!item)return '<article class="leaf '+(side==='right'?'second':'')+' blank-page"><div class="folio">✦</div></article>';
 const label=item.part||item.section||(item.kind==='dedication'?'DEDICATORIA':item.kind==='thanks'?'AGRADECIMIENTOS':item.kind==='abstract'?'RESUMEN':item.kind==='index'?'CONTENIDO':item.kind==='prologue'?'PRÓLOGO':'');
 const heading=item.title;
 const titleVisible=item.pageNum===undefined||item.pageNum===1;
 const content=item.paras.map(x=>'<p>'+esc(x)+'</p>').join('');
 const notice=item.partial?'<p class="note">'+(excerpts[item.chapter]?'Extracto conservado · falta incorporar la versión íntegra':'Texto íntegro pendiente de incorporar desde los capítulos aprobados')+'</p>':'';
 return '<article class="leaf '+(side==='right'?'second':'')+(item.kind==='index'?' index-page':'')+'"><div class="label">'+esc(label)+'</div>'+(item.chapter?'<div class="number">CAPÍTULO '+item.chapter+(item.pageNum>1?' · continuación':'')+'</div>':'')+(titleVisible?'<h2>'+esc(heading)+'</h2>':'<div class="continuation">'+esc(heading)+'</div>')+'<div class="prose">'+content+notice+'</div><div class="folio">'+String(index+1).padStart(3,'0')+'</div></article>';
}
function coverMarkup(){return '<section class="cover"><div class="frame"><div class="star">✦</div><div class="kicker">UNA NOVELA DE RECUERDOS</div><h1>Mientras<br>ordeno<br>mi cuarto</h1><div class="line"></div><div class="subtitle">Un estudio sobre el desorden, los recuerdos y otras cosas que nunca aprendí a organizar.</div><div class="author">ALLAN</div></div></section>'}
function render(){
 const spread=spreads[current];
 book.innerHTML=spread.cover?coverMarkup():'<div class="spread">'+pageMarkup(spread.left,'left',spread.leftIndex)+pageMarkup(spread.right,'right',spread.leftIndex+1)+'</div>';
 document.getElementById('prev').disabled=current===0;
 document.getElementById('next').disabled=current===spreads.length-1;
 const item=spread.left||{};
 document.getElementById('location').textContent=spread.cover?'Portada':item.chapter?'Capítulo '+item.chapter+' · páginas '+(spread.leftIndex+1)+'–'+Math.min(spread.leftIndex+2,pages.length):'Páginas '+(spread.leftIndex+1)+'–'+Math.min(spread.leftIndex+2,pages.length);
 document.getElementById('bar').style.width=(100*current/(spreads.length-1))+'%';
 window.scrollTo({top:0,behavior:'instant'});
}
let isTurning=false;
function go(i){
 const target=Math.max(0,Math.min(spreads.length-1,i));
 if(target===current||isTurning)return;
 const oldSpread=book.querySelector('.spread');
 const oldLeft=oldSpread?.querySelector('.leaf:not(.second)')?.cloneNode(true);
 const oldRight=oldSpread?.querySelector('.leaf.second')?.cloneNode(true);
 const forward=target>current;
 current=target;render();
 const newSpread=book.querySelector('.spread');
 if(!oldSpread||!newSpread)return;
 const newLeft=newSpread.querySelector('.leaf:not(.second)')?.cloneNode(true);
 const newRight=newSpread.querySelector('.leaf.second')?.cloneNode(true);
 const turn=document.createElement('div');turn.className='page-turn '+(forward?'forward':'backward');
 const staticPage=document.createElement('div');staticPage.className='turn-static';
 staticPage.appendChild(forward?oldLeft:oldRight);
 const sheet=document.createElement('div');sheet.className='turn-sheet';
 const front=document.createElement('div');front.className='turn-face front';front.appendChild(forward?oldRight:oldLeft);
 const back=document.createElement('div');back.className='turn-face back';back.appendChild(forward?newLeft:newRight);
 sheet.append(front,back);turn.append(staticPage,sheet);book.appendChild(turn);
 isTurning=true;book.classList.add('turning');
 requestAnimationFrame(()=>requestAnimationFrame(()=>turn.classList.add('active')));
 const finish=()=>{turn.remove();book.classList.remove('turning');isTurning=false};
 sheet.addEventListener('transitionend',finish,{once:true});
 setTimeout(()=>{if(isTurning&&turn.isConnected)finish()},1200);
}
function goToEntry(entryIndex){go(Math.floor(entryIndex/2)+1)}
document.getElementById('prev').onclick=()=>go(current-1);
document.getElementById('next').onclick=()=>go(current+1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(current+1);if(e.key==='ArrowLeft')go(current-1)});
const toc=document.getElementById('toc');document.getElementById('indexBtn').onclick=()=>toc.classList.toggle('hidden');document.getElementById('close').onclick=()=>toc.classList.add('hidden');
const tocItems=document.getElementById('tocItems');
groups.forEach(([part,titles],gi)=>{let h=document.createElement('h3');h.textContent=part;tocItems.appendChild(h);titles.forEach((t,ti)=>{const n=groups.slice(0,gi).reduce((a,g)=>a+g[1].length,0)+ti+1;let b=document.createElement('button');b.textContent=String(n).padStart(2,'0')+' — '+t;b.onclick=()=>{goToEntry(entries.findIndex(e=>e.chapter===n)-1);toc.classList.add('hidden')};tocItems.appendChild(b)})});
let endTitle=document.createElement('h3');endTitle.textContent='Al cerrar el libro';tocItems.appendChild(endTitle);
for(const k of ['CONCLUSIONES','REFERENCIAS BIBLIOGRÁFICAS','APÉNDICE A','APÉNDICE B','EPÍLOGO']){let b=document.createElement('button');b.textContent=newContent[k].title;b.onclick=()=>{goToEntry(entries.findIndex(e=>e.section===k)-1);toc.classList.add('hidden')};tocItems.appendChild(b)}
render();
</script></body></html>
